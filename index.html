    <script>
      window.pixelId = "%VITE_UTMIFY_PIXEL_ID%";

      function loadTrackingPixels() {
        [
          "https://cdn.utmify.com.br/scripts/pixel/pixel.js"
        ].forEach(function (src) {
          var script = document.createElement("script");
          script.async = true;
          script.src = src;
          document.head.appendChild(script);
        });
      }

      if ("requestIdleCallback" in window) {
        window.requestIdleCallback(loadTrackingPixels, { timeout: 1800 });
      } else {
        window.setTimeout(loadTrackingPixels, 900);
      }
    </script>
